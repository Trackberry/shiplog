# Shiplog-Texte auf Deutsch (förmliche Anrede „Sie“). Hosts können jeden Schlüssel in ihren eigenen Sprachdateien überschreiben.
de:
  activerecord:
    attributes:
      shiplog/entry:
        changelog_kind: Kategorie
  # Die Monatsnamen, die Shiplogs Datumsformat verwendet (rails-i18n liefert sie auch; es sind dieselben).
  date:
    month_names: [~, Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember]
  shiplog:
    columns:
      in_progress: In Arbeit
      coming_soon: Demnächst
      later: Später
      in_progress_description: Woran wir gerade arbeiten
      coming_soon_description: Als Nächstes geplant
      later_description: Auf unserem Radar
    categories:
      feature: Neu
      change: Verbessert
      announcement: Monatsrückblick
    empty: Hier gibt es noch nichts
    date_format: "%-d. %B %Y"
    roadmap:
      title: Roadmap
      lede: Woran wir arbeiten und was als Nächstes kommt.
      parts:
        one: Umfasst %{count} Teil
        other: Umfasst %{count} Teile
      shipped_heading: Kürzlich veröffentlicht
      shipped_date_format: "%-d. %B"
      full_changelog: Alle Neuigkeiten ansehen
      footnote: ""
      suggest: Funktion vorschlagen
    switcher:
      label: Produkt-Updates
      roadmap: Roadmap
      changelog: Neuigkeiten
    changelog:
      title: Neuigkeiten
      lede: Neue Funktionen und Verbesserungen, sobald sie verfügbar sind.
