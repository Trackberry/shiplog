# Textos de Shiplog en español. Los hosts pueden sobrescribir cualquier clave en sus propios archivos de idioma.
es:
  activerecord:
    attributes:
      shiplog/entry:
        changelog_kind: Categoría
  # Los nombres de los meses que usa el formato de fecha de Shiplog (rails-i18n los trae también; son los mismos).
  date:
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
  shiplog:
    columns:
      in_progress: En desarrollo
      coming_soon: Próximamente
      later: Más adelante
      in_progress_description: Lo que estamos construyendo ahora
      coming_soon_description: Lo siguiente en la lista
      later_description: En nuestro radar
    categories:
      feature: Nuevo
      change: Mejorado
    empty: Todavía no hay nada
    date_format: "%-d de %B de %Y"
    roadmap:
      title: Hoja de ruta
      lede: En qué estamos trabajando y qué viene después.
      parts:
        one: Incluye %{count} parte
        other: Incluye %{count} partes
      shipped_heading: Lanzado recientemente
      shipped_date_format: "%-d de %B"
      full_changelog: Ver el registro de cambios completo
      footnote: ""
      suggest: Sugerir una función
    switcher:
      label: Actualizaciones del producto
      roadmap: Hoja de ruta
      changelog: Registro de cambios
    changelog:
      title: Registro de cambios
      lede: Nuevas funciones y mejoras, a medida que se lanzan.
      pagination:
        label: Paginación
        older: Anteriores
        newer: Más recientes
      search:
        label: Buscar en el registro de cambios
        submit: Buscar
        summary:
          one: "%{count} resultado para “%{query}”"
          other: "%{count} resultados para “%{query}”"
        clear: Borrar búsqueda
        empty: "Ninguna entrada coincide con “%{query}”."
      areas:
        label: Filtrar por área
        all: Todas
    permalink:
      title: "%{title} · %{changelog}"
      back: "← Volver al registro de cambios"
      nav_label: Más cambios
      newer: "← Más reciente: %{title}"
      older: "Anterior: %{title} →"
    feed:
      title_with_product: "Registro de cambios de %{product}"
      link_title: Registro de cambios (Atom)
      subscribe: Suscribirse (Atom)
    admin:
      title: Administración de Shiplog
      nav:
        drafts: Borradores
        board: Tablero de la hoja de ruta
        sync: Sincronización
        areas: Áreas
      areas:
        title: Áreas del producto
        help: La IA agrupa las entradas en áreas (como máximo %{max}) mientras las reescribe. Los visitantes pueden filtrar el registro de cambios por área cuando hay dos áreas con entradas publicadas.
        detect: Detectar áreas
        recheck: Revisar de nuevo las entradas sin área
        recheck_help: Vuelve a preguntar a la IA por las entradas que dejó sin área, por ejemplo después de renombrar, fusionar o añadir áreas.
        no_rewriter: La detección necesita config.rewriter, que no está configurado.
        last_detection: "Última detección: %{time}, %{count} asignadas"
        last_error: "La última detección falló (%{time}): %{error}"
        detection_queued: Detección en cola. Actualiza en un momento.
        translate_names: Traducir nombres
        translate_names_help: Pide a la IA los nombres que faltan en algún idioma. Los nombres que ya existen, incluidos los que editaste, se conservan.
        no_locales: Traducir los nombres necesita config.locales, que está vacío.
        no_rewriter_translate: Traducir los nombres necesita config.rewriter, que no está configurado.
        translation_queued:
          one: Traducción en cola para %{count} área. Actualiza en un momento.
          other: Traducción en cola para %{count} áreas. Actualiza en un momento.
        empty: Todavía no hay áreas. Detecta áreas para que se propongan a partir de tus entradas.
        columns:
          name: Nombre
          entries: Entradas
          order: Orden
          merge: Fusionar con
        name_label: Nombre
        rename: Renombrar
        renamed: Área renombrada.
        move_up: Subir
        move_down: Bajar
        merge: Fusionar
        merge_into: Fusionar con
        merged: "%{from} se fusionó con %{into}."
        merge_target: Elige otra área con la que fusionar.
        merge_help: Al fusionar, las entradas pasan a la otra área y esta se elimina. Si eliminas un área, sus entradas se quedan sin área.
        delete: Eliminar
        deleted: Área eliminada. Sus entradas ya no tienen área.
