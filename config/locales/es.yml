          alt_saved: Texto alternativo guardado.
          removed: Imagen quitada.
          moved: Imagen movida.
        translations:
          title: Traducciones
          help: "Al aprobar una entrada, esta se traduce automáticamente, y la traducción se publica junto con el texto en inglés. Una traducción que edites se conserva hasta que cambie el texto en inglés; entonces se vuelve a traducir. Una traducción desactualizada o ausente no se muestra: los visitantes ven el texto en inglés."
          not_approved: Las traducciones se escriben cuando se aprueba la entrada.
