          title: Capturas de pantalla
          help: Se muestran bajo el texto en el registro de cambios (la primera en la lista, todas en la página de la entrada). Se toman de la incidencia o del pull request de GitHub al escribir el borrador; también puedes subir las tuyas.
          empty: Todavía no hay capturas.
          alt: Texto alternativo
          alt_placeholder: Describe la imagen (por defecto, el título)
