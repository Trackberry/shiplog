# Shiplog-teksten in het Nederlands (aanspreekvorm “u”). Hosts kunnen elke sleutel overschrijven in hun eigen taalbestanden.
nl:
  activerecord:
    attributes:
      shiplog/entry:
        changelog_kind: Categorie
  # De maandnamen die het datumformaat van Shiplog gebruikt (rails-i18n levert ze ook; het zijn dezelfde).
  date:
    month_names: [~, januari, februari, maart, april, mei, juni, juli, augustus, september, oktober, november, december]
  shiplog:
    columns:
      in_progress: In ontwikkeling
      coming_soon: Binnenkort
      later: Later
      in_progress_description: Waar we nu aan bouwen
      coming_soon_description: Hierna gepland
      later_description: Op onze radar
    categories:
      feature: Nieuw
      change: Verbeterd
      announcement: Maandoverzicht
    empty: Hier staat nog niets
    date_format: "%-d %B %Y"
    roadmap:
      title: Roadmap
      lede: Waar we aan werken en wat er hierna komt.
      parts:
        one: Bestaat uit %{count} onderdeel
        other: Bestaat uit %{count} onderdelen
      shipped_heading: Onlangs uitgebracht
      shipped_date_format: "%-d %B"
      full_changelog: Bekijk de volledige changelog
      footnote: ""
      suggest: Een functie voorstellen
    switcher:
