version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  groups:
    bundler:
      patterns:
        - "*"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  groups:
    github-actions:
      patterns:
        - "*"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
